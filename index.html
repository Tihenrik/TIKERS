<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prancheta Tática Pro — Editor de Lances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13;
    --panel:#121920;
    --panel-2:#161f27;
    --panel-3:#1b2530;
    --border:#232e38;
    --green:#2fae66;
    --gold:#f2b134;
    --red:#e2493d;
    --blue:#3d8ff2;
    --text:#eef3f6;
    --muted:#8a97a3;
    --font-display:'Barlow Condensed', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  button{font-family:inherit;}
  ::selection{background:rgba(242,177,52,0.35);}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:12px 20px;
    background:linear-gradient(180deg,#141c24,#101720);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--text);
  }
  .brand-mark span{color:var(--gold);}
  .pro-badge{
    background:var(--gold);
    color:#1a1200;
    font-family:var(--font-display);
    font-weight:700;
    font-size:0.7rem;
    letter-spacing:0.08em;
    padding:2px 8px;
    border-radius:3px;
  }
  .scorebug{
    display:flex;align-items:center;gap:6px;
    font-family:var(--font-display);
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    border-left:1px solid var(--border);
    padding-left:14px;
    margin-left:4px;
  }
  .rec-dot{
    width:7px;height:7px;border-radius:50%;background:var(--red);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  @media (prefers-reduced-motion: reduce){ .rec-dot{animation:none;} }

  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .btn:hover{border-color:var(--gold);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--border);}
  .btn-primary{background:var(--gold);color:#1a1200;border-color:var(--gold);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-danger{background:var(--red);color:#fff;border-color:var(--red);}
  .btn-ghost{background:transparent;}

  /* ---------- workspace ---------- */
  .workspace{
    flex:1;
    display:flex;
    min-height:0;
  }
  .tools-dock{
    width:92px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 8px;
    gap:6px;
    overflow-y:auto;
  }
  .tool-btn{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:transparent;
    border:1px solid transparent;
    border-radius:10px;
    padding:9px 4px;
    color:var(--muted);
    cursor:pointer;
    transition:all .15s;
  }
  .tool-btn svg{width:22px;height:22px;stroke:currentColor;}
  .tool-btn span{
    font-family:var(--font-display);
    font-size:0.62rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.1;
  }
  .tool-btn:hover{color:var(--text);background:var(--panel-2);}
  .tool-btn.active{color:var(--gold);background:rgba(242,177,52,0.12);border-color:rgba(242,177,52,0.4);}

  .canvas-stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    overflow:auto;
    background:
      radial-gradient(ellipse at center, rgba(47,174,102,0.05), transparent 60%),
      var(--bg);
  }
  .canvas-frame{
    position:relative;
    max-width:100%;
    background:#000;
    border:1px solid var(--border);
    border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
    transition:border-color .15s, background .15s;
  }
  .canvas-frame.dragover{border-color:var(--gold);background:rgba(242,177,52,0.05);}
  .canvas-frame.tool-select #board{cursor:pointer;}
  #board{
    display:block;
    width:100%;
    height:auto;
    max-height:78vh;
    touch-action:none;
    cursor:crosshair;
    border-radius:2px;
  }
  .corner{position:absolute;width:22px;height:22px;pointer-events:none;}
  .corner.tl{top:-1px;left:-1px;border-top:3px solid var(--gold);border-left:3px solid var(--gold);}
  .corner.tr{top:-1px;right:-1px;border-top:3px solid var(--gold);border-right:3px solid var(--gold);}
  .corner.bl{bottom:-1px;left:-1px;border-bottom:3px solid var(--gold);border-left:3px solid var(--gold);}
  .corner.br{bottom:-1px;right:-1px;border-bottom:3px solid var(--gold);border-right:3px solid var(--gold);}

  .empty-state{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:40px;
    background:rgba(10,14,19,0.94);
    border:2px dashed var(--border);
    border-radius:4px;
  }
  .canvas-frame.has-image .empty-state{display:none;}
  .empty-state svg{width:48px;height:48px;stroke:var(--muted);}
  .empty-state h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.3rem;
    margin:0;
    color:var(--text);
    letter-spacing:0.01em;
  }
  .empty-state p{margin:0;color:var(--muted);font-size:0.88rem;max-width:320px;}
  .canvas-frame{min-width:280px;min-height:280px;}
  #board{background:#05070a;}

  /* placeholder sizing before an image exists */
  .canvas-frame:not(.has-image) #board{width:640px;max-width:80vw;height:400px;}

  /* ---------- properties panel ---------- */
  .properties-panel{
    width:270px;
    background:var(--panel);
    border-left:1px solid var(--border);
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
  }
  .panel-section label.section-label{
    display:block;
    font-family:var(--font-display);
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{
    width:28px;height:28px;border-radius:50%;
    border:2px solid var(--border);
    cursor:pointer;
    transition:transform .12s, border-color .12s;
    padding:0;
  }
  .swatch:hover{transform:scale(1.08);}
  .swatch.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,177,52,0.25);}
  .custom-color-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .custom-color-row input[type=color]{
    width:36px;height:28px;border:1px solid var(--border);border-radius:6px;background:none;padding:0;cursor:pointer;
  }
  .custom-color-row span{font-size:0.78rem;color:var(--muted);}

  input[type=range]{width:100%;accent-color:var(--gold);}
  .range-row{display:flex;align-items:center;gap:10px;}
  .range-row .val{
    font-family:var(--font-display);font-weight:600;font-size:0.95rem;
    min-width:26px;text-align:right;color:var(--gold);
  }

  .team-row{display:flex;gap:8px;}
  .team-btn{
    flex:1;padding:9px 6px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-size:0.8rem;font-weight:600;cursor:pointer;
  }
  .team-btn[data-color="#3d8ff2"]{border-left:4px solid var(--blue);}
  .team-btn[data-color="#e2493d"]{border-left:4px solid var(--red);}
  .team-btn.active{background:var(--panel-3);border-color:var(--gold);}

  .hint-box{
    margin-top:auto;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    font-size:0.8rem;
    line-height:1.4;
    color:var(--muted);
  }
  .hint-box strong{color:var(--text);font-family:var(--font-display);font-weight:600;letter-spacing:0.03em;}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .workspace{flex-direction:column;}
    .tools-dock{
      width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);
      justify-content:flex-start;
    }
    .tool-btn{width:auto;min-width:64px;}
    .properties-panel{width:100%;border-left:none;border-top:1px solid var(--border);}
    .canvas-stage{padding:16px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">Prancheta <span>Tática</span></div>
    <div class="pro-badge">PRO</div>
    <div class="scorebug"><span class="rec-dot"></span>ANÁLISE DE LANCE</div>
  </div>
  <div class="actions">
    <button class="btn" id="loadBtnTop">Carregar imagem</button>
    <button class="btn" id="undoBtn" disabled>Desfazer</button>
    <button class="btn" id="redoBtn" disabled>Refazer</button>
    <button class="btn btn-ghost" id="resetBtn" disabled>Limpar marcações</button>
    <button class="btn btn-primary" id="saveBtn" disabled>Salvar imagem</button>
  </div>
</header>

<main class="workspace">

  <aside class="tools-dock">
    <button class="tool-btn active" data-tool="arrow" title="Seta tática">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 Q10 5 20 7"/><path d="M20 7l-4.5-1"/><path d="M20 7l-2 4.2"/></svg>
      <span>Seta</span>
    </button>
    <button class="tool-btn" data-tool="zone" title="Zona em perspectiva">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 L7 6 L17 6 L20 19 Z"/></svg>
      <span>Zona</span>
    </button>
    <button class="tool-btn" data-tool="trail" title="Trajetória 3D da bola">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 Q12 2 21 9"/><circle cx="21" cy="9" r="1.7" fill="currentColor" stroke="none"/><ellipse cx="3" cy="20.3" rx="2.4" ry="0.7" fill="currentColor" stroke="none" opacity="0.5"/></svg>
      <span>Bola 3D</span>
    </button>
    <button class="tool-btn" data-tool="player" title="Marcador de jogador">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1.2-4.2 4-6.4 7.5-6.4s6.3 2.2 7.5 6.4"/></svg>
      <span>Jogador</span>
    </button>
    <button class="tool-btn" data-tool="text" title="Texto / anotação">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M12 6.5v13"/></svg>
      <span>Texto</span>
    </button>
    <button class="tool-btn" data-tool="freehand" title="Traço livre">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l3.2-0.8L17.5 8.9a2 2 0 0 0 0-2.8l-1.6-1.6a2 2 0 0 0-2.8 0L2.8 14.8z"/><path d="M13.6 5.9l2.5 2.5"/></svg>
      <span>Traço</span>
    </button>
    <button class="tool-btn" data-tool="select" title="Selecionar / excluir">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l4 17 2.2-6.8L19 11z"/></svg>
      <span>Selecionar</span>
    </button>
  </aside>

  <section class="canvas-stage">
    <div class="canvas-frame" id="canvasFrame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <canvas id="board"></canvas>
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V6.2A2.2 2.2 0 0 1 6.2 4h11.6A2.2 2.2 0 0 1 20 6.2v10.3"/><path d="M4 16.5l5-5.4 3.5 3.6 3-3.2L20 16"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="M4 19h16"/></svg>
        <h2>Carregue o lance para começar</h2>
        <p>Arraste uma imagem aqui ou selecione um arquivo para iniciar a marcação tática.</p>
        <button class="btn btn-primary" id="loadBtnEmpty">Selecionar imagem</button>
      </div>
    </div>
  </section>

  <aside class="properties-panel">
    <div class="panel-section" id="colorSection">
      <label class="section-label">Cor</label>
      <div class="swatch-row">
        <button class="swatch active" data-color="#ffffff" style="background:#ffffff"></button>
        <button class="swatch" data-color="#f2b134" style="background:#f2b134"></button>
        <button class="swatch" data-color="#e2493d" style="background:#e2493d"></button>
        <button class="swatch" data-color="#3d8ff2" style="background:#3d8ff2"></button>
        <button class="swatch" data-color="#2fae66" style="background:#2fae66"></button>
        <button class="swatch" data-color="#111318" style="background:#111318"></button>
      </div>
      <div class="custom-color-row">
        <input type="color" id="customColor" value="#ffffff">
        <span>Cor personalizada</span>
      </div>
    </div>

    <div class="panel-section" id="widthSection">
      <label class="section-label">Espessura</label>
      <div class="range-row">
        <input type="range" id="widthSlider" min="2" max="60" value="10">
        <span class="val" id="widthValue">10</span>
      </div>
    </div>

    <div class="panel-section" id="arcSection">
      <label class="section-label">Altura do arco (bola 3D)</label>
      <div class="range-row">
        <input type="range" id="arcSlider" min="0.1" max="0.9" step="0.05" value="0.35">
        <span class="val" id="arcValue">0.35</span>
      </div>
    </div>

    <div class="panel-section" id="teamSection">
      <label class="section-label">Time do jogador</label>
      <div class="team-row">
        <button class="team-btn active" data-color="#3d8ff2">Time A</button>
        <button class="team-btn" data-color="#e2493d">Time B</button>
      </div>
    </div>

    <div class="panel-section" id="selectSection">
      <label class="section-label">Marcação selecionada</label>
      <button class="btn btn-danger" id="deleteSelectedBtn" style="width:100%;">Excluir selecionado</button>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:8px;">Toque em Delete/Backspace no teclado também remove o item selecionado.</p>
    </div>

    <div class="hint-box">
      <strong>Dica:</strong>
      <p id="toolHint" style="margin:6px 0 0;"></p>
    </div>
  </aside>

</main>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const canvasFrame = document.getElementById('canvasFrame');
  const fileInput = document.getElementById('fileInput');
  const widthSlider = document.getElementById('widthSlider');
  const widthValue = document.getElementById('widthValue');
  const arcSlider = document.getElementById('arcSlider');
  const arcValue = document.getElementById('arcValue');
  const customColor = document.getElementById('customColor');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const saveBtn = document.getElementById('saveBtn');
  const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
  const toolHint = document.getElementById('toolHint');

  let img = null;
  let hasImage = false;
  let objects = [];
  let redoStack = [];
  let currentTool = 'arrow';
  let currentColor = '#ffffff';
  let currentWidth = 10;
  let arcHeight = 0.35;
  let teamColor = '#3d8ff2';
  let selectedIndex = -1;
  let pending = null;
  let zonePreviewPoint = null;
  let drawing = false;

  const hints = {
    arrow: 'Clique e arraste para desenhar uma seta com perspectiva, sombra e volume.',
    zone: 'Clique para marcar até 4 cantos da área. Um clique duplo conclui antes com 3 pontos.',
    trail: 'Clique no ponto de partida e arraste até o ponto de chegada da bola para gerar o arco 3D.',
    player: 'Clique no campo para posicionar um jogador. Você pode informar o número da camisa.',
    text: 'Clique no local desejado e digite a anotação.',
    freehand: 'Clique, arraste e solte para desenhar um traço livre à mão.',
    select: 'Clique em uma marcação para selecioná-la. Exclua pelo botão ou pela tecla Delete.'
  };

  /* ---------------- helpers ---------------- */
  function shadeColor(hex, percent){
    const f = parseInt(hex.slice(1),16);
    const t = percent<0 ? 0 : 255;
    const p = percent<0 ? percent*-1 : percent;
    const R=f>>16, G=(f>>8)&0x00FF, B=f&0x0000FF;
    const nr = Math.round((t-R)*p/100)+R;
    const ng = Math.round((t-G)*p/100)+G;
    const nb = Math.round((t-B)*p/100)+B;
    return "#"+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
  }
  function hexToRgba(hex,a){
    const v = hex.replace('#','');
    const r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function quadPoint(p0,c,p1,t){
    const mt = 1-t;
    return { x: mt*mt*p0.x + 2*mt*t*c.x + t*t*p1.x, y: mt*mt*p0.y + 2*mt*t*c.y + t*t*p1.y };
  }
  function depthScale(y){
    const t = Math.min(1, Math.max(0, y/canvas.height));
    return 0.5 + 0.5*t;
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width;
    const scaleY = canvas.height/rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }

  /* ---------------- drawing primitives ---------------- */
  function drawTaperedCurve(pc, p0,c,p1,wStart,wEnd,color){
    const N=28;
    const topPts=[], botPts=[];
    let endTangent=null;
    for(let i=0;i<=N;i++){
      const t=i/N;
      const pt=quadPoint(p0,c,p1,t);
      const t2=Math.min(t+0.01,1);
      const pt2=quadPoint(p0,c,p1,t2);
      let tx=pt2.x-pt.x, ty=pt2.y-pt.y;
      const len=Math.hypot(tx,ty)||1; tx/=len; ty/=len;
      const nx=-ty, ny=tx;
      const w=(wStart+(wEnd-wStart)*t)/2;
      topPts.push({x:pt.x+nx*w,y:pt.y+ny*w});
      botPts.push({x:pt.x-nx*w,y:pt.y-ny*w});
      if(i===N) endTangent={x:tx,y:ty};
    }
    pc.save();
    pc.shadowColor='rgba(0,0,0,0.45)';
    pc.shadowBlur=Math.max(4,wStart*0.5);
    pc.shadowOffsetY=Math.max(2,wStart*0.18);
    pc.beginPath();
    pc.moveTo(topPts[0].x, topPts[0].y);
    for(const p of topPts) pc.lineTo(p.x,p.y);
    for(let i=botPts.length-1;i>=0;i--) pc.lineTo(botPts[i].x,botPts[i].y);
    pc.closePath();
    let grad;
    try{
      grad = pc.createLinearGradient(p0.x,p0.y,p1.x,p1.y);
      grad.addColorStop(0, color);
      grad.addColorStop(1, shadeColor(color,-15));
    } catch(e){ grad = color; }
    pc.fillStyle = grad;
    pc.fill();
    pc.lineWidth = Math.max(1,wStart*0.05);
    pc.strokeStyle = 'rgba(0,0,0,0.35)';
    pc.shadowBlur = 0;
    pc.stroke();
    pc.restore();
    return { end:p1, endTangent };
  }

  function drawArrowHead(pc, tip, dir, size, color){
    if(!dir) dir = {x:1,y:0};
    const angle = Math.atan2(dir.y,dir.x);
    const back = {x:tip.x-Math.cos(angle)*size, y:tip.y-Math.sin(angle)*size};
    const left = {x:back.x+Math.cos(angle+Math.PI/2)*size*0.55, y:back.y+Math.sin(angle+Math.PI/2)*size*0.55};
    const right= {x:back.x+Math.cos(angle-Math.PI/2)*size*0.55, y:back.y+Math.sin(angle-Math.PI/2)*size*0.55};
    pc.save();
    pc.shadowColor='rgba(0,0,0,0.4)'; pc.shadowBlur=4;
    pc.beginPath();
    pc.moveTo(tip.x,tip.y);
    pc.lineTo(left.x,left.y);
    pc.lineTo(right.x,right.y);
    pc.closePath();
    pc.fillStyle=color;
    pc.fill();
    pc.restore();
  }

  function drawArrow(pc,o){
    const p0=o.points[0], p1=o.points[1];
    const dx=p1.x-p0.x, dy=p1.y-p0.y;
    const dist=Math.hypot(dx,dy)||1;
    const mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
    const nx=-dy/dist, ny=dx/dist;
    const bend=dist*0.14;
    const c={x:mx+nx*bend,y:my+ny*bend};
    const wStart=o.width, wEnd=Math.max(2,o.width*0.35);
    const res=drawTaperedCurve(pc,p0,c,p1,wStart,wEnd,o.color);
    const headSize=Math.max(8,o.width*1.6);
    drawArrowHead(pc,p1,res.endTangent,headSize,shadeColor(o.color,-15));
  }

  function drawZone(pc,o){
    if(o.points.length<2) return;
    pc.save();
    pc.beginPath();
    pc.moveTo(o.points[0].x,o.points[0].y);
    for(let i=1;i<o.points.length;i++) pc.lineTo(o.points[i].x,o.points[i].y);
    if(o.points.length>=3) pc.closePath();
    if(o.points.length>=3){
      pc.fillStyle = hexToRgba(o.color,0.20);
      pc.fill();
    }
    pc.lineWidth = Math.max(2,o.width*0.5);
    pc.strokeStyle = o.color;
    pc.setLineDash([o.width*1.1, o.width*0.7]);
    pc.shadowColor='rgba(0,0,0,0.5)'; pc.shadowBlur=6;
    pc.stroke();
    pc.restore();
  }

  function drawGroundShadow(pc,pt,radius,scale){
    pc.save();
    pc.beginPath();
    pc.ellipse(pt.x, pt.y+radius*0.25, radius, radius*0.34, 0,0,Math.PI*2);
    pc.fillStyle = `rgba(0,0,0,${(0.30*scale).toFixed(2)})`;
    if(typeof pc.filter !== 'undefined') pc.filter = 'blur(3px)';
    pc.fill();
    pc.filter = 'none';
    pc.restore();
  }

  function drawBallSprite(pc,pt,r){
    pc.save();
    pc.beginPath();
    pc.ellipse(pt.x, pt.y+r*0.95, r*1.15, r*0.42, 0,0,Math.PI*2);
    pc.fillStyle = 'rgba(0,0,0,0.38)';
    if(typeof pc.filter !== 'undefined') pc.filter = 'blur(2px)';
    pc.fill();
    pc.filter = 'none';
    const grad = pc.createRadialGradient(pt.x-r*0.35,pt.y-r*0.35,r*0.15,pt.x,pt.y,r);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.65,'#e2e8ec');
    grad.addColorStop(1,'#9aa6ad');
    pc.beginPath();
    pc.arc(pt.x,pt.y,r,0,Math.PI*2);
    pc.fillStyle = grad;
    pc.shadowColor = 'rgba(0,0,0,0.5)';
    pc.shadowBlur = Math.max(2,r*0.3);
    pc.fill();
    pc.strokeStyle = 'rgba(0,0,0,0.25)';
    pc.lineWidth = Math.max(0.5,r*0.06);
    pc.shadowBlur = 0;
    pc.stroke();
    pc.restore();
  }

  function drawTrail(pc,o){
    const p0=o.points[0], p1=o.points[1];
    const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const lift = dist*o.peakFactor + canvas.height*0.04;
    const midx=(p0.x+p1.x)/2;
    const midy=Math.min(p0.y,p1.y)-lift;
    const c={x:midx,y:midy};
    const s0=depthScale(p0.y), s1=depthScale(p1.y);
    drawGroundShadow(pc,p0,o.width*2.2*s0,s0);
    drawGroundShadow(pc,p1,o.width*2.2*s1,s1);
    const wStart=Math.max(2,o.width*0.85*s0);
    const wEnd=Math.max(2,o.width*0.85*s1);
    drawTaperedCurve(pc,p0,c,p1,wStart,wEnd,o.color);
    drawBallSprite(pc,p0,Math.max(4,o.width*1.5*s0));
    drawBallSprite(pc,p1,Math.max(4,o.width*1.5*s1));
  }

  function drawPlayer(pc,o){
    const pt=o.points[0];
    const scale=depthScale(pt.y);
    const r=o.baseR*scale;
    pc.save();
    pc.beginPath();
    pc.ellipse(pt.x, pt.y+r*0.85, r*1.05, r*0.35, 0,0,Math.PI*2);
    pc.fillStyle='rgba(0,0,0,0.4)';
    if(typeof pc.filter !== 'undefined') pc.filter='blur(1.5px)';
    pc.fill();
    pc.filter='none';
    const grad = pc.createRadialGradient(pt.x-r*0.3,pt.y-r*0.3,r*0.1,pt.x,pt.y,r);
    grad.addColorStop(0, shadeColor(o.color,30));
    grad.addColorStop(1, o.color);
    pc.beginPath();
    pc.arc(pt.x,pt.y,r,0,Math.PI*2);
    pc.fillStyle=grad;
    pc.lineWidth=Math.max(1,r*0.12);
    pc.strokeStyle='rgba(0,0,0,0.5)';
    pc.shadowColor='rgba(0,0,0,0.5)'; pc.shadowBlur=5;
    pc.fill();
    pc.shadowBlur=0;
    pc.stroke();
    if(o.number){
      pc.fillStyle='#0a0e13';
      pc.font = `bold ${Math.round(r*1.05)}px 'Barlow Condensed', sans-serif`;
      pc.textAlign='center'; pc.textBaseline='middle';
      pc.fillText(o.number, pt.x, pt.y+r*0.05);
    }
    pc.restore();
  }

  function drawText(pc,o){
    pc.save();
    pc.font = `700 ${o.size}px 'Barlow Condensed', sans-serif`;
    pc.textBaseline='middle';
    pc.shadowColor='rgba(0,0,0,0.6)'; pc.shadowBlur=4;
    pc.lineWidth = Math.max(2,o.size*0.12);
    pc.strokeStyle='rgba(0,0,0,0.7)';
    pc.strokeText(o.text,o.points[0].x,o.points[0].y);
    pc.fillStyle=o.color;
    pc.shadowBlur=3;
    pc.fillText(o.text,o.points[0].x,o.points[0].y);
    pc.restore();
  }

  function drawFreehand(pc,o){
    if(o.points.length<2) return;
    pc.save();
    pc.lineJoin='round'; pc.lineCap='round';
    pc.strokeStyle=o.color; pc.lineWidth=o.width;
    pc.shadowColor='rgba(0,0,0,0.4)'; pc.shadowBlur=4;
    pc.beginPath();
    pc.moveTo(o.points[0].x,o.points[0].y);
    for(let i=1;i<o.points.length-1;i++){
      const mx=(o.points[i].x+o.points[i+1].x)/2;
      const my=(o.points[i].y+o.points[i+1].y)/2;
      pc.quadraticCurveTo(o.points[i].x,o.points[i].y,mx,my);
    }
    const last=o.points[o.points.length-1];
    pc.lineTo(last.x,last.y);
    pc.stroke();
    pc.restore();
  }

  function getBBox(o){
    if(o.type==='player'){
      const r=o.baseR*1.5;
      return {x:o.points[0].x-r,y:o.points[0].y-r,w:r*2,h:r*2};
    }
    if(o.type==='text'){
      const w=o.size*o.text.length*0.55;
      return {x:o.points[0].x-5,y:o.points[0].y-o.size*0.6,w:w,h:o.size*1.3};
    }
    const xs=o.points.map(p=>p.x), ys=o.points.map(p=>p.y);
    const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
    return {x:minX,y:minY,w:Math.max(4,maxX-minX),h:Math.max(4,maxY-minY)};
  }

  function drawSelectionOutline(o){
    const b = getBBox(o);
    ctx.save();
    ctx.strokeStyle='#f2b134';
    ctx.lineWidth=Math.max(2,canvas.width*0.0018);
    ctx.setLineDash([canvas.width*0.01, canvas.width*0.006]);
    ctx.strokeRect(b.x-12,b.y-12,b.w+24,b.h+24);
    ctx.restore();
  }

  function drawObject(o,highlighted){
    switch(o.type){
      case 'arrow': drawArrow(ctx,o); break;
      case 'zone': drawZone(ctx,o); break;
      case 'trail': drawTrail(ctx,o); break;
      case 'player': drawPlayer(ctx,o); break;
      case 'text': drawText(ctx,o); break;
      case 'freehand': drawFreehand(ctx,o); break;
    }
    if(highlighted) drawSelectionOutline(o);
  }

  function render(){
    if(!hasImage) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    objects.forEach((o,i)=> drawObject(o, i===selectedIndex));
    if(pending) drawObject(pending,false);
    if(currentTool==='zone' && pending && zonePreviewPoint){
      drawObject({...pending, points:[...pending.points, zonePreviewPoint]}, false);
    }
    updateActionButtons();
  }

  function updateActionButtons(){
    undoBtn.disabled = objects.length===0;
    redoBtn.disabled = redoStack.length===0;
    resetBtn.disabled = objects.length===0;
    saveBtn.disabled = !hasImage;
    deleteSelectedBtn.disabled = selectedIndex<0;
  }

  function hitTest(pos){
    for(let i=objects.length-1;i>=0;i--){
      const b=getBBox(objects[i]);
      const pad=Math.max(14, canvas.width*0.012);
      if(pos.x>=b.x-pad && pos.x<=b.x+b.w+pad && pos.y>=b.y-pad && pos.y<=b.y+b.h+pad) return i;
    }
    return -1;
  }

  function finalizeObject(o){
    objects.push(o);
    redoStack=[];
    render();
  }

  function undo(){
    if(objects.length){ redoStack.push(objects.pop()); selectedIndex=-1; render(); }
  }
  function redo(){
    if(redoStack.length){ objects.push(redoStack.pop()); render(); }
  }
  function deleteSelected(){
    if(selectedIndex>=0){
      objects.splice(selectedIndex,1);
      selectedIndex=-1;
      redoStack=[];
      render();
    }
  }

  /* ---------------- image loading ---------------- */
  function loadImageFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const image = new Image();
      image.onload = ()=>{
        img = image;
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        objects=[]; redoStack=[]; selectedIndex=-1; pending=null; zonePreviewPoint=null;
        currentWidth = Math.max(3, Math.round(image.naturalWidth/260));
        widthSlider.value = currentWidth;
        widthValue.textContent = currentWidth;
        hasImage = true;
        canvasFrame.classList.add('has-image');
        render();
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function handleNewImage(file){
    if(!file) return;
    if(hasImage && objects.length>0){
      if(!confirm('Carregar uma nova imagem apagará as marcações atuais. Continuar?')) return;
    }
    loadImageFile(file);
  }

  document.getElementById('loadBtnEmpty').addEventListener('click', ()=> fileInput.click());
  document.getElementById('loadBtnTop').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', e=>{
    const f = e.target.files[0];
    handleNewImage(f);
    fileInput.value='';
  });
  canvasFrame.addEventListener('dragover', e=>{ e.preventDefault(); canvasFrame.classList.add('dragover'); });
  canvasFrame.addEventListener('dragleave', ()=> canvasFrame.classList.remove('dragover'));
  canvasFrame.addEventListener('drop', e=>{
    e.preventDefault();
    canvasFrame.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    handleNewImage(f);
  });

  /* ---------------- pointer interactions ---------------- */
  function onDown(e){
    if(!hasImage) return;
    const pos = getPos(e);
    if(currentTool==='select'){
      selectedIndex = hitTest(pos);
      render();
      return;
    }
    if(currentTool==='arrow' || currentTool==='trail'){
      drawing = true;
      pending = {type: currentTool, points:[pos, {x:pos.x,y:pos.y}], color: currentColor, width: currentWidth, peakFactor: arcHeight};
      render();
      return;
    }
    if(currentTool==='freehand'){
      drawing = true;
      pending = {type:'freehand', points:[pos], color: currentColor, width: currentWidth};
      return;
    }
    if(currentTool==='zone'){
      if(!pending){
        pending = {type:'zone', points:[pos], color: currentColor, width: currentWidth};
      } else {
        pending.points.push(pos);
        if(pending.points.length>=4){
          finalizeObject(pending);
          pending=null; zonePreviewPoint=null;
        }
      }
      render();
      return;
    }
    if(currentTool==='player'){
      const number = prompt('Número da camisa (opcional):','');
      finalizeObject({type:'player', points:[pos], color: teamColor, number: number ? number.trim().slice(0,2) : '', baseR: Math.max(12, canvas.width/45)});
      return;
    }
    if(currentTool==='text'){
      const txt = prompt('Digite o texto da anotação:','');
      if(txt && txt.trim()){
        finalizeObject({type:'text', points:[pos], color: currentColor, text: txt.trim(), size: Math.max(18, canvas.width/26)});
      }
      return;
    }
  }

  function onMove(e){
    if(!hasImage) return;
    const pos = getPos(e);
    if(drawing && pending){
      if(pending.type==='freehand') pending.points.push(pos);
      else pending.points[1] = pos;
      render();
    } else if(currentTool==='zone' && pending){
      zonePreviewPoint = pos;
      render();
    }
  }

  function onUp(){
    if(drawing && pending){
      drawing=false;
      const p = pending;
      pending = null;
      if(p.type==='freehand'){
        if(p.points.length>2) finalizeObject(p);
      } else {
        const d = Math.hypot(p.points[1].x-p.points[0].x, p.points[1].y-p.points[0].y);
        if(d>4) finalizeObject(p);
      }
      render();
    }
  }

  canvas.addEventListener('pointerdown', e=>{
    if(e.pointerId!==undefined && canvas.setPointerCapture){
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    }
    onDown(e);
  });
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('dblclick', ()=>{
    if(currentTool==='zone' && pending && pending.points.length>=3){
      finalizeObject(pending);
      pending=null; zonePreviewPoint=null;
      render();
    }
  });

  window.addEventListener('keydown', e=>{
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    if(activeTag==='INPUT' || activeTag==='TEXTAREA') return;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
    else if(e.key==='Delete' || e.key==='Backspace'){ if(selectedIndex>=0){ e.preventDefault(); deleteSelected(); } }
    else if(e.key==='Escape'){ pending=null; zonePreviewPoint=null; drawing=false; render(); }
  });

  /* ---------------- toolbar / panel wiring ---------------- */
  function updatePanels(){
    const show = id=>document.getElementById(id).style.display='';
    const hide = id=>document.getElementById(id).style.display='none';
    hide('colorSection'); hide('widthSection'); hide('arcSection'); hide('teamSection'); hide('selectSection');
    if(['arrow','zone','trail','text','freehand'].includes(currentTool)) show('colorSection');
    if(['arrow','zone','trail','freehand'].includes(currentTool)) show('widthSection');
    if(currentTool==='trail') show('arcSection');
    if(currentTool==='player') show('teamSection');
    if(currentTool==='select') show('selectSection');
    toolHint.textContent = hints[currentTool] || '';
  }

  document.querySelectorAll('.tool-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
      pending=null; zonePreviewPoint=null; drawing=false;
      canvasFrame.classList.toggle('tool-select', currentTool==='select');
      updatePanels();
      render();
    });
  });

  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      currentColor = sw.dataset.color;
      customColor.value = currentColor;
    });
  });
  customColor.addEventListener('input', e=>{
    currentColor = e.target.value;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  });

  document.querySelectorAll('.team-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.team-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      teamColor = b.dataset.color;
    });
  });

  widthSlider.addEventListener('input', e=>{
    currentWidth = parseFloat(e.target.value);
    widthValue.textContent = currentWidth;
  });
  arcSlider.addEventListener('input', e=>{
    arcHeight = parseFloat(e.target.value);
    arcValue.textContent = arcHeight.toFixed(2);
  });

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  deleteSelectedBtn.addEventListener('click', deleteSelected);
  resetBtn.addEventListener('click', ()=>{
    if(objects.length===0) return;
    if(confirm('Limpar todas as marcações desta imagem?')){
      objects=[]; redoStack=[]; selectedIndex=-1; render();
    }
  });
  saveBtn.addEventListener('click', ()=>{
    if(!hasImage) return;
    const prevSel = selectedIndex;
    selectedIndex = -1;
    render();
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'prancheta-tatica-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      selectedIndex = prevSel;
      render();
    }, 'image/png', 1.0);
  });

  updatePanels();
  updateActionButtons();
})();
</script>
</body>
</html>
