<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Diligências — Mapa de Cobertura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --line:#e7e7e9;
    --ink:#16171b;
    --muted:#84858c;
    --accent:#4f46e5;
    --amber:#d98a2b;
    --teal:#1f8f6f;
    --danger:#d54848;
    --fog:rgba(17,18,22,0.90);
    --radius:14px;
    --shadow:0 8px 28px rgba(20,20,30,0.14);
    --topbar-h:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:#0e0e11;
    overflow:hidden;
  }
  button{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100dvh;}

  /* ---------------- TOPBAR ---------------- */
  #topbar{
    height:var(--topbar-h);flex-shrink:0;
    display:flex;align-items:center;gap:10px;
    padding:0 12px;background:var(--ink);color:#fff;
    z-index:60;
  }
  #hamburger-btn{
    width:36px;height:36px;border-radius:9px;background:transparent;border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  #hamburger-btn:active{background:rgba(255,255,255,0.1);}
  #hamburger-btn svg{width:20px;height:20px;}
  #brand{font-weight:600;font-size:15px;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar-spacer{flex:1;}
  #progress-chip{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);
    padding:5px 10px;border-radius:20px;flex-shrink:0;
  }
  #progress-chip .pct{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;}
  #progress-ring-track{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,0.15);overflow:hidden;}
  #progress-ring-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .35s ease;}

  /* ---------------- LAYOUT ---------------- */
  #main{flex:1;display:flex;position:relative;min-height:0;}
  #map-wrap{flex:1;position:relative;background:#dcdde0;}
  #map{position:absolute;inset:0;}
  #fog-canvas{position:absolute;inset:0;pointer-events:none;}

  /* ---------------- BACKDROP (mobile) ---------------- */
  #backdrop{
    position:fixed;inset:0;background:rgba(10,10,14,0.4);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #backdrop.show{opacity:1;pointer-events:auto;}

  /* ---------------- PANEL (drawer on mobile / sidebar on desktop) ---------------- */
  #panel{
    position:fixed;left:0;right:0;bottom:0;
    height:78vh;max-height:640px;
    background:var(--panel);
    border-radius:18px 18px 0 0;
    box-shadow:0 -6px 30px rgba(0,0,0,0.22);
    transform:translateY(102%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:50;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  #panel.open{transform:translateY(0);}
  #drawer-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 4px;flex-shrink:0;}

  .panel-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  .sec{padding:14px 18px;border-bottom:1px solid var(--line);}
  .sec:last-child{border-bottom:none;}
  .sec-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;}

  .row{display:flex;gap:8px;align-items:center;}
  select, input[type=text]{
    font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;
    padding:9px 10px;color:var(--ink);background:#fafafa;width:100%;
  }
  select:focus, input:focus{outline:none;border-color:var(--accent);background:#fff;}

  .btn{
    border:none;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  }
  .btn-icon{width:36px;height:36px;padding:0;flex-shrink:0;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .btn-icon:active{background:#f2f2f4;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:active{background:#000;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:active{background:#f4f4f5;}
  .btn-danger-text{background:transparent;color:var(--danger);}
  .btn-block{width:100%;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal.on{background:var(--ink);}

  #user-badge{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#f2f2f4;
    padding:6px 10px;border-radius:8px;color:var(--ink);white-space:nowrap;
  }

  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;}

  #tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px;}
  .tab{
    padding:11px 4px;margin-right:20px;font-size:13px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.active{color:var(--ink);border-color:var(--ink);}
  .tab .count{font-family:'IBM Plex Mono',monospace;font-weight:400;margin-left:3px;color:var(--muted);}

  #list-wrap{padding:10px 14px 20px;}
  .loc-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;cursor:pointer;
  }
  .loc-card:active{background:#f7f7f8;}
  .loc-card .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .loc-card .name{font-weight:600;font-size:13.5px;}
  .loc-card .addr{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .dot.pending{background:var(--amber);}
  .dot.done{background:var(--teal);}
  .loc-card .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:6px;}
  .empty-msg{color:var(--muted);font-size:12.5px;padding:24px 8px;text-align:center;line-height:1.6;}

  /* ---------------- FAB ---------------- */
  #fab-add{
    position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;z-index:30;
    transition:background .15s ease, transform .15s ease;
  }
  #fab-add.active{background:var(--danger);transform:rotate(45deg);}
  #fab-add svg{width:24px;height:24px;}

  #status-chip{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;
    display:none;align-items:center;gap:7px;z-index:25;box-shadow:var(--shadow);
  }
  #status-chip.show{display:flex;}
  #status-chip .pulse{width:8px;height:8px;border-radius:50%;background:#5ee6a8;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}

  #legend{
    position:absolute;bottom:14px;left:14px;background:rgba(17,18,22,0.85);color:#fff;
    padding:8px 12px;border-radius:9px;font-size:10.5px;display:flex;gap:12px;
    font-family:'IBM Plex Mono',monospace;z-index:20;
  }
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:7px;height:7px;border-radius:50%;}

  #new-loc-card{
    position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:16px;
    box-shadow:var(--shadow);padding:16px;z-index:35;display:none;
  }
  #new-loc-card h3{margin:0 0 10px;font-size:14.5px;font-weight:700;}
  #new-loc-card label{font-size:11px;color:var(--muted);display:block;margin-top:9px;}
  #new-loc-card input, #new-loc-card textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;
    font-family:inherit;margin-top:4px;
  }
  #new-loc-card textarea{resize:vertical;min-height:44px;}
  #new-loc-card .actions{display:flex;gap:8px;margin-top:14px;}

  #toast-container{position:absolute;top:12px;right:12px;left:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:70;pointer-events:none;}
  .toast{
    background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:12.5px;
    box-shadow:var(--shadow);animation:fadeIn .2s ease;max-width:88%;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  .leaflet-popup-content-wrapper{border-radius:12px;}
  .leaflet-control-attribution{font-size:9.5px !important;}

  /* ---------------- DESKTOP ---------------- */
  @media (min-width:900px){
    #hamburger-btn{display:none;}
    #backdrop{display:none;}
    #panel{
      position:static;width:360px;height:auto;max-height:none;border-radius:0;
      box-shadow:none;border-right:1px solid var(--line);transform:none;
    }
    #drawer-handle{display:none;}
    #new-loc-card{left:auto;width:300px;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="hamburger-btn" aria-label="Abrir painel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="brand">Diligências</div>
    <div id="topbar-spacer"></div>
    <div id="progress-chip">
      <div id="progress-ring-track"><div id="progress-ring-fill"></div></div>
      <span class="pct" id="progress-pct">0%</span>
    </div>
  </div>

  <div id="main">
    <div id="backdrop"></div>

    <div id="panel">
      <div id="drawer-handle"></div>
      <div class="panel-scroll">

        <div class="sec">
          <div class="sec-label">Usuário</div>
          <div class="row">
            <div id="user-badge">—</div>
            <select id="user-select" style="flex:1;"></select>
            <button class="btn-icon" id="new-user-btn" title="Novo usuário">＋</button>
          </div>
          <div class="row" style="margin-top:10px;">
            <button class="btn btn-outline" id="reset-btn" style="flex:1;">Reiniciar progresso</button>
            <button class="btn-icon" id="export-btn" title="Exportar">⭳</button>
            <button class="btn-icon" id="import-btn" title="Importar">⭱</button>
            <input type="file" id="import-file" accept="application/json" style="display:none;">
          </div>
        </div>

        <div class="sec">
          <div class="sec-label">Buscar endereço</div>
          <div class="row">
            <input type="text" id="search-input" placeholder="Digite um endereço…">
            <button class="btn btn-primary" id="search-btn">Ir</button>
          </div>
        </div>

        <div class="sec">
          <div class="sec-label">Exploração em campo</div>
          <button class="btn btn-teal btn-block" id="exploration-toggle">▶ Iniciar exploração (GPS)</button>
          <div class="hint">Sua localização real revela o mapa conforme você se desloca. Chegar perto de um local pendente conclui a diligência automaticamente.</div>
        </div>

        <div id="tabs">
          <div class="tab active" data-tab="pending">Pendentes <span class="count" id="count-pending">0</span></div>
          <div class="tab" data-tab="done">Concluídas <span class="count" id="count-done">0</span></div>
        </div>
        <div id="list-wrap"></div>
      </div>
    </div>

    <div id="map-wrap">
      <div id="map"></div>
      <canvas id="fog-canvas"></canvas>

      <div id="status-chip"><div class="pulse"></div><span>Explorando…</span></div>

      <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--amber);"></div>Pendente</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--teal);"></div>Concluída</div>
      </div>

      <button id="fab-add" title="Adicionar local">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>

      <div id="new-loc-card">
        <h3>Nova diligência</h3>
        <label>Nome do local</label>
        <input type="text" id="nl-name" placeholder="Ex: Imóvel Rua das Flores, 123">
        <label>Endereço</label>
        <input type="text" id="nl-address">
        <label>Observações</label>
        <textarea id="nl-notes" placeholder="Notas internas, contato, referência…"></textarea>
        <div class="actions">
          <button class="btn btn-outline" id="nl-cancel" style="flex:1;">Cancelar</button>
          <button class="btn btn-primary" id="nl-save" style="flex:1;">Salvar</button>
        </div>
      </div>

      <div id="toast-container"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ======================================================================
   PERSISTÊNCIA (localStorage — por navegador/dispositivo, por usuário)
   ====================================================================== */
const STORE_USERS_KEY = "diligencias_users_v2";
const STORE_CURRENT_KEY = "diligencias_current_user_v2";
const STORE_DATA_PREFIX = "diligencias_data_v2_";

function getUsers(){ try{ return JSON.parse(localStorage.getItem(STORE_USERS_KEY)) || []; }catch(e){ return []; } }
function saveUsers(list){ localStorage.setItem(STORE_USERS_KEY, JSON.stringify(list)); }
function getCurrentUserName(){ return localStorage.getItem(STORE_CURRENT_KEY) || null; }
function setCurrentUserName(name){ localStorage.setItem(STORE_CURRENT_KEY, name); }
function defaultState(){ return { locations: [], explored: [] }; }
function loadState(user){
  try{ const raw = localStorage.getItem(STORE_DATA_PREFIX + user); return raw ? JSON.parse(raw) : defaultState(); }
  catch(e){ return defaultState(); }
}
function saveState(user, state){ localStorage.setItem(STORE_DATA_PREFIX + user, JSON.stringify(state)); }

let state = defaultState();
let currentUser = null;

/* ======================================================================
   MAPA (Leaflet + tiles CARTO Positron — sem chave de API)
   ====================================================================== */
let map, fogCanvas, fogCtx;
let markers = {};
let watchId = null;
let userPosMarker = null;
let addModeActive = false;
let pendingClickLatLng = null;

const REVEAL_RADIUS_LOCATION = 160;
const REVEAL_RADIUS_TRAIL = 55;
const MIN_TRAIL_STEP = 22;
const ARRIVAL_RADIUS = 55;

function initApp(){
  map = L.map('map', { zoomControl:false, attributionControl:true }).setView([-14.235,-51.9253], 4.2);
  L.control.zoom({ position:'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors © CARTO'
  }).addTo(map);

  fogCanvas = document.getElementById('fog-canvas');
  fogCtx = fogCanvas.getContext('2d');

  map.on('move zoom resize', scheduleFogRedraw);
  window.addEventListener('resize', scheduleFogRedraw);

  map.on('click', (e)=>{
    if(!addModeActive) return;
    openNewLocForm(e.latlng, e.originalEvent);
  });

  initUsersUI();
  bindUI();
  scheduleFogRedraw();
}

let fogRAF = null;
function scheduleFogRedraw(){
  if(fogRAF) cancelAnimationFrame(fogRAF);
  fogRAF = requestAnimationFrame(drawFog);
}

function metersPerPixelAt(lat, zoom){
  return 156543.03392 * Math.cos(lat * Math.PI/180) / Math.pow(2, zoom);
}

function drawFog(){
  if(!map) return;
  const wrap = document.getElementById('map-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(fogCanvas.width !== w || fogCanvas.height !== h){ fogCanvas.width = w; fogCanvas.height = h; }

  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.clearRect(0,0,w,h);
  fogCtx.fillStyle = 'rgba(17,18,22,0.90)';
  fogCtx.fillRect(0,0,w,h);

  const zoom = map.getZoom();

  function toXY(lat,lng){ const p = map.latLngToContainerPoint([lat,lng]); return {x:p.x, y:p.y}; }
  function cutHole(lat,lng,radiusMeters){
    const {x,y} = toXY(lat,lng);
    const mpp = metersPerPixelAt(lat, zoom);
    const r = radiusMeters / mpp;
    if(r < 2) return;
    fogCtx.globalCompositeOperation = 'destination-out';
    const grad = fogCtx.createRadialGradient(x,y,r*0.55,x,y,r);
    grad.addColorStop(0,'rgba(0,0,0,1)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.fillStyle = grad;
    fogCtx.beginPath(); fogCtx.arc(x,y,r,0,Math.PI*2); fogCtx.fill();
    return {x,y,r};
  }

  state.explored.forEach(p => cutHole(p.lat,p.lng, REVEAL_RADIUS_TRAIL));

  state.locations.filter(l=>l.status==='done').forEach(l=>{
    const res = cutHole(l.lat,l.lng, REVEAL_RADIUS_LOCATION);
    if(res){
      fogCtx.globalCompositeOperation = 'source-over';
      fogCtx.strokeStyle = 'rgba(31,143,111,0.5)';
      fogCtx.lineWidth = 2;
      fogCtx.beginPath(); fogCtx.arc(res.x,res.y,res.r,0,Math.PI*2); fogCtx.stroke();
    }
  });

  fogCtx.globalCompositeOperation = 'source-over';
  state.locations.filter(l=>l.status==='pending').forEach(l=>{
    const {x,y} = toXY(l.lat,l.lng);
    if(x < -20 || y < -20 || x > w+20 || y > h+20) return;
    fogCtx.beginPath(); fogCtx.arc(x,y,7,0,Math.PI*2);
    fogCtx.fillStyle = 'rgba(217,138,43,0.95)'; fogCtx.fill();
    fogCtx.lineWidth = 2; fogCtx.strokeStyle = 'rgba(255,255,255,0.9)'; fogCtx.stroke();
    fogCtx.beginPath(); fogCtx.arc(x,y,13,0,Math.PI*2);
    fogCtx.strokeStyle = 'rgba(217,138,43,0.4)'; fogCtx.lineWidth = 1.5; fogCtx.stroke();
  });
}

/* ======================================================================
   MARCADORES
   ====================================================================== */
function renderMarkers(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  state.locations.forEach(loc=>{
    const marker = L.circleMarker([loc.lat, loc.lng], {
      radius: 8,
      fillColor: loc.status === 'done' ? '#1f8f6f' : '#d98a2b',
      color: '#fff', weight: 2, fillOpacity: 1
    }).addTo(map);
    marker.bindPopup(buildPopupContent(loc), { closeButton:true, minWidth:220 });
    marker.on('popupopen', ()=> bindPopupButtons(loc.id));
    markers[loc.id] = marker;
  });
  scheduleFogRedraw();
}

function buildPopupContent(loc){
  const statusLabel = loc.status === 'done' ? '✅ Concluída' : '🕘 Pendente';
  const doneInfo = loc.doneAt ? `<div style="font-size:11px;color:#84858c;margin-top:4px;">Concluída em ${new Date(loc.doneAt).toLocaleString('pt-BR')}</div>` : '';
  return `
    <div style="font-family:'Inter',sans-serif;max-width:210px;">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:2px;">${escapeHtml(loc.name)}</div>
      <div style="font-size:11.5px;color:#84858c;">${escapeHtml(loc.address||'')}</div>
      <div style="font-size:12px;margin-top:6px;">${statusLabel}</div>
      ${doneInfo}
      ${loc.notes ? `<div style="font-size:11.5px;margin-top:6px;border-top:1px solid #eee;padding-top:6px;">${escapeHtml(loc.notes)}</div>` : ''}
      <div style="margin-top:10px;display:flex;gap:6px;">
        <button data-action="toggle" data-id="${loc.id}" style="flex:1;padding:6px 8px;border:none;border-radius:7px;cursor:pointer;background:${loc.status==='done' ? '#d98a2b' : '#1f8f6f'};color:#fff;font-size:11.5px;font-weight:600;">
          ${loc.status === 'done' ? 'Reabrir' : 'Concluir'}
        </button>
        <button data-action="delete" data-id="${loc.id}" style="padding:6px 8px;border:1px solid #d54848;background:transparent;color:#d54848;border-radius:7px;cursor:pointer;font-size:11.5px;font-weight:600;">Excluir</button>
      </div>
    </div>`;
}
function bindPopupButtons(id){
  document.querySelectorAll(`[data-id="${id}"]`).forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.action === 'toggle') toggleStatus(id);
      else if(btn.dataset.action === 'delete'){ if(confirm('Excluir esta diligência do mapa?')) deleteLocation(id); }
      map.closePopup();
    };
  });
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ======================================================================
   AÇÕES SOBRE LOCAIS
   ====================================================================== */
function toggleStatus(id){
  const loc = state.locations.find(l=>l.id===id); if(!loc) return;
  loc.status = loc.status === 'done' ? 'pending' : 'done';
  loc.doneAt = loc.status === 'done' ? Date.now() : null;
  persist(); renderMarkers(); renderList(); renderProgress();
  toast(loc.status==='done' ? `Diligência concluída: ${loc.name}` : `Diligência reaberta: ${loc.name}`);
}
function deleteLocation(id){
  state.locations = state.locations.filter(l=>l.id!==id);
  persist(); renderMarkers(); renderList(); renderProgress();
}
function addLocation({name, address, lat, lng, notes}){
  state.locations.push({
    id: 'loc_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    name: name || 'Local sem nome', address: address || '',
    lat, lng, notes: notes || '', status: 'pending', doneAt: null
  });
  persist(); renderMarkers(); renderList(); renderProgress();
}

/* ======================================================================
   NOVO LOCAL (Nominatim para geocodificação — gratuito, sem chave)
   ====================================================================== */
function openNewLocForm(latlng){
  pendingClickLatLng = latlng;
  const card = document.getElementById('new-loc-card');
  card.style.display = 'block';
  document.getElementById('nl-name').value = '';
  document.getElementById('nl-notes').value = '';
  document.getElementById('nl-address').value = 'Buscando endereço…';
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
    .then(r=>r.json())
    .then(d=>{ document.getElementById('nl-address').value = d.display_name || 'Endereço não encontrado'; })
    .catch(()=>{ document.getElementById('nl-address').value = 'Endereço não encontrado'; });
  document.getElementById('nl-name').focus();
}
function closeNewLocForm(){
  document.getElementById('new-loc-card').style.display = 'none';
  pendingClickLatLng = null;
}

/* ======================================================================
   LISTA LATERAL / ABAS
   ====================================================================== */
let activeTab = 'pending';
function renderList(){
  const wrap = document.getElementById('list-wrap');
  wrap.innerHTML = '';
  const items = state.locations.filter(l => activeTab === 'pending' ? l.status==='pending' : l.status==='done');
  document.getElementById('count-pending').textContent = state.locations.filter(l=>l.status==='pending').length;
  document.getElementById('count-done').textContent = state.locations.filter(l=>l.status==='done').length;

  if(items.length === 0){
    wrap.innerHTML = `<div class="empty-msg">${activeTab==='pending' ? 'Nenhuma diligência pendente.<br>Toque no botão “+” e depois no mapa para cadastrar um local.' : 'Nenhuma diligência concluída ainda.'}</div>`;
    return;
  }
  items.sort((a,b)=> (b.doneAt||0) - (a.doneAt||0));
  items.forEach(loc=>{
    const card = document.createElement('div');
    card.className = 'loc-card';
    card.innerHTML = `
      <div class="row1">
        <div>
          <div class="name">${escapeHtml(loc.name)}</div>
          <div class="addr">${escapeHtml(loc.address||'')}</div>
        </div>
        <div class="dot ${loc.status}"></div>
      </div>
      <div class="meta">${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}${loc.doneAt ? ' · ' + new Date(loc.doneAt).toLocaleDateString('pt-BR') : ''}</div>
    `;
    card.onclick = ()=>{
      map.setView([loc.lat, loc.lng], Math.max(map.getZoom(), 15));
      markers[loc.id].openPopup();
      closePanel();
    };
    wrap.appendChild(card);
  });
}
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active'); activeTab = tab.dataset.tab; renderList();
  });
});

/* ======================================================================
   PROGRESSO
   ====================================================================== */
function renderProgress(){
  const total = state.locations.length;
  const done = state.locations.filter(l=>l.status==='done').length;
  const pct = total === 0 ? 0 : Math.round((done/total)*100);
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-ring-fill').style.width = pct + '%';
}

/* ======================================================================
   USUÁRIOS
   ====================================================================== */
function initUsersUI(){
  let users = getUsers();
  if(users.length === 0){ users = ['Padrão']; saveUsers(users); }
  let current = getCurrentUserName();
  if(!current || !users.includes(current)){ current = users[0]; setCurrentUserName(current); }
  populateUserSelect(users, current);
  switchUser(current, true);
}
function populateUserSelect(users, current){
  const sel = document.getElementById('user-select');
  sel.innerHTML = '';
  users.forEach(u=>{
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u; if(u === current) opt.selected = true;
    sel.appendChild(opt);
  });
}
function switchUser(name, silent){
  currentUser = name; setCurrentUserName(name); state = loadState(name);
  document.getElementById('user-badge').textContent = name;
  renderMarkers(); renderList(); renderProgress();
  if(!silent) toast(`Usuário alterado para: ${name}`);
}
function persist(){ if(currentUser) saveState(currentUser, state); }

/* ======================================================================
   EXPLORAÇÃO POR GPS
   ====================================================================== */
function toggleExploration(){
  const btn = document.getElementById('exploration-toggle');
  const chip = document.getElementById('status-chip');
  if(watchId === null){
    if(!navigator.geolocation){ toast('Geolocalização não disponível neste navegador.'); return; }
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
    btn.textContent = '⏸ Parar exploração'; btn.classList.add('on'); chip.classList.add('show');
    toast('Exploração iniciada. Desloque-se para revelar o mapa.');
  } else {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    btn.textContent = '▶ Iniciar exploração (GPS)'; btn.classList.remove('on'); chip.classList.remove('show');
    toast('Exploração pausada.');
  }
}
function onPositionError(err){ toast('Não foi possível obter sua localização: ' + err.message); }
function onPosition(pos){
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  if(!userPosMarker){
    userPosMarker = L.circleMarker([lat,lng], { radius:7, fillColor:'#4a90e2', fillOpacity:1, color:'#fff', weight:2 }).addTo(map);
    map.setView([lat,lng], 16);
  } else { userPosMarker.setLatLng([lat,lng]); }

  const last = state.explored[state.explored.length-1];
  if(!last || map.distance([last.lat,last.lng],[lat,lng]) > MIN_TRAIL_STEP){
    state.explored.push({lat,lng});
    if(state.explored.length > 3000) state.explored.shift();
    persist();
  }

  state.locations.filter(l=>l.status==='pending').forEach(l=>{
    if(map.distance([l.lat,l.lng],[lat,lng]) <= ARRIVAL_RADIUS){
      l.status = 'done'; l.doneAt = Date.now();
      toast(`✅ Diligência concluída automaticamente: ${l.name}`);
      persist(); renderMarkers(); renderList(); renderProgress();
    }
  });
  scheduleFogRedraw();
}

/* ======================================================================
   TOASTS
   ====================================================================== */
function toast(msg){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  c.appendChild(el); setTimeout(()=> el.remove(), 4200);
}

/* ======================================================================
   PAINEL (drawer mobile / sidebar desktop)
   ====================================================================== */
function openPanel(){ document.getElementById('panel').classList.add('open'); document.getElementById('backdrop').classList.add('show'); }
function closePanel(){ document.getElementById('panel').classList.remove('open'); document.getElementById('backdrop').classList.remove('show'); }

/* ======================================================================
   LIGAÇÃO DA UI
   ====================================================================== */
function bindUI(){
  document.getElementById('hamburger-btn').addEventListener('click', ()=>{
    document.getElementById('panel').classList.contains('open') ? closePanel() : openPanel();
  });
  document.getElementById('backdrop').addEventListener('click', closePanel);

  document.getElementById('user-select').addEventListener('change', (e)=> switchUser(e.target.value));

  document.getElementById('new-user-btn').addEventListener('click', ()=>{
    const name = prompt('Nome do novo usuário (ex: nome do agente de campo):');
    if(!name) return;
    const trimmed = name.trim(); if(!trimmed) return;
    let users = getUsers();
    if(!users.includes(trimmed)) users.push(trimmed);
    saveUsers(users); populateUserSelect(users, trimmed); switchUser(trimmed);
  });

  document.getElementById('reset-btn').addEventListener('click', ()=>{
    if(!confirm(`Reiniciar todo o progresso do usuário "${currentUser}"?\n\nTodas as diligências voltarão a "pendente" e a área explorada será apagada. Os locais cadastrados NÃO serão excluídos.`)) return;
    state.explored = [];
    state.locations.forEach(l=>{ l.status='pending'; l.doneAt=null; });
    persist(); renderMarkers(); renderList(); renderProgress();
    toast('Progresso reiniciado.');
  });

  document.getElementById('export-btn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify({user:currentUser, state}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `diligencias_${currentUser}.json`; a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('import-btn').addEventListener('click', ()=> document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data.state && data.state.locations){
          state = data.state; persist(); renderMarkers(); renderList(); renderProgress();
          toast('Dados importados com sucesso.');
        } else toast('Arquivo inválido.');
      }catch(err){ toast('Erro ao importar arquivo.'); }
    };
    reader.readAsText(file);
  });

  document.getElementById('fab-add').addEventListener('click', (e)=>{
    addModeActive = !addModeActive;
    e.currentTarget.classList.toggle('active', addModeActive);
    toast(addModeActive ? 'Toque em um ponto do mapa para cadastrar o local.' : 'Modo de adição cancelado.');
  });

  document.getElementById('search-btn').addEventListener('click', doSearch);
  document.getElementById('search-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });
  function doSearch(){
    const q = document.getElementById('search-input').value.trim();
    if(!q) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`)
      .then(r=>r.json())
      .then(results=>{
        if(results && results[0]){
          map.setView([parseFloat(results[0].lat), parseFloat(results[0].lon)], 15);
          closePanel();
        } else toast('Endereço não encontrado.');
      })
      .catch(()=> toast('Erro ao buscar endereço.'));
  }

  document.getElementById('nl-cancel').addEventListener('click', ()=>{ closeNewLocForm(); addModeActive=false; document.getElementById('fab-add').classList.remove('active'); });
  document.getElementById('nl-save').addEventListener('click', ()=>{
    if(!pendingClickLatLng) return;
    const name = document.getElementById('nl-name').value.trim();
    const address = document.getElementById('nl-address').value.trim();
    const notes = document.getElementById('nl-notes').value.trim();
    addLocation({ name: name || 'Local sem nome', address, notes, lat: pendingClickLatLng.lat, lng: pendingClickLatLng.lng });
    closeNewLocForm();
    addModeActive = false; document.getElementById('fab-add').classList.remove('active');
    toast('Diligência adicionada.');
  });

  document.getElementById('exploration-toggle').addEventListener('click', toggleExploration);
}

initApp();
</script>
</body>
</html>
