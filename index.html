<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANC Experimental</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c10;
    --surface: #0e141b;
    --border: #1e2d3d;
    --accent: #00e5ff;
    --accent2: #ff3d71;
    --text: #c8d8e8;
    --text-dim: #4a6278;
    --green: #00ffaa;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }

  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* Big power button */
  .power-wrap {
    display: flex;
    justify-content: center;
    padding: 10px 0;
  }

  .power-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    box-shadow: 0 0 0 0 transparent;
  }

  .power-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 24px rgba(0,229,255,0.2);
  }

  .power-btn.on {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 32px rgba(0,255,170,0.35), inset 0 0 20px rgba(0,255,170,0.05);
    animation: pulse-btn 2s ease-in-out infinite;
  }

  .power-btn.stopping {
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: 0 0 24px rgba(255,61,113,0.3);
    animation: none;
  }

  @keyframes pulse-btn {
    0%, 100% { box-shadow: 0 0 32px rgba(0,255,170,0.35), inset 0 0 20px rgba(0,255,170,0.05); }
    50%       { box-shadow: 0 0 60px rgba(0,255,170,0.6), inset 0 0 30px rgba(0,255,170,0.1); }
  }

  .state-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-align: center;
    margin-top: 10px;
    color: var(--text-dim);
    transition: color 0.3s;
  }

  .state-label.on  { color: var(--green); }
  .state-label.err { color: var(--accent2); }

  /* Waveform */
  canvas {
    display: block;
    width: 100%;
    height: 80px;
    border-radius: 8px;
    background: #0a1018;
  }

  .canvas-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* Sliders */
  .slider-row { display: flex; flex-direction: column; gap: 14px; }

  .sl { display: flex; flex-direction: column; gap: 5px; }

  .sl-top { display: flex; justify-content: space-between; }

  .sl-name { font-size: 13px; font-weight: 700; }

  .sl-val {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    cursor: pointer;
  }

  .warning {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.8;
    max-width: 420px;
  }

  .warning strong { color: var(--accent2); }

  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div style="text-align:center">
  <h1>ANC Experimental</h1>
  <div class="subtitle">CANCELAMENTO ATIVO DE RUÍDO</div>
</div>

<div class="card" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
  <div class="power-wrap">
    <button class="power-btn" id="powerBtn" title="Ligar / Desligar ANC">⏻</button>
  </div>
  <div class="state-label" id="stateLabel">DESLIGADO — clique para ligar</div>
</div>

<div class="card">
  <div class="canvas-label">WAVEFORM — ENTRADA DO MICROFONE</div>
  <canvas id="canvas" width="800" height="160"></canvas>
</div>

<div class="card">
  <div class="section-title">Controles</div>
  <div class="slider-row">
    <div class="sl">
      <div class="sl-top">
        <span class="sl-name">Volume de Saída</span>
        <span class="sl-val" id="volVal">50%</span>
      </div>
      <input type="range" id="volSlider" min="0" max="100" value="50">
    </div>
    <div class="sl">
      <div class="sl-top">
        <span class="sl-name">Intensidade da Inversão</span>
        <span class="sl-val" id="invVal">1.00×</span>
      </div>
      <input type="range" id="invSlider" min="50" max="150" value="100">
    </div>
  </div>
</div>

<p class="warning">
  <strong>⚠ Use fones fechados.</strong><br>
  Volume alto pode causar feedback intenso nos fones.
</p>

<script>
const powerBtn   = document.getElementById('powerBtn');
const stateLabel = document.getElementById('stateLabel');
const canvas     = document.getElementById('canvas');
const ctx2d      = canvas.getContext('2d');
const volSlider  = document.getElementById('volSlider');
const invSlider  = document.getElementById('invSlider');
const volVal     = document.getElementById('volVal');
const invVal     = document.getElementById('invVal');

let audioCtx  = null;
let analyser  = null;
let processor = null;
let source    = null;
let gainNode  = null;
let stream    = null;
let animId    = null;
let running   = false;

volSlider.oninput = () => {
  volVal.textContent = volSlider.value + '%';
  if (gainNode) gainNode.gain.value = volSlider.value / 100;
};

invSlider.oninput = () => {
  invVal.textContent = (invSlider.value / 100).toFixed(2) + '×';
};

powerBtn.onclick = async () => {
  if (running) { stop(); } else { await start(); }
};

async function start() {
  try {
    setLabel('AGUARDANDO MICROFONE…', '');
    powerBtn.disabled = true;

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();

    source   = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = volSlider.value / 100;

    // ScriptProcessor: inverte cada sample do buffer
    processor = audioCtx.createScriptProcessor(2048, 1, 1);
    processor.onaudioprocess = (e) => {
      const input  = e.inputBuffer.getChannelData(0);
      const output = e.outputBuffer.getChannelData(0);
      const factor = -(invSlider.value / 100);
      for (let i = 0; i < input.length; i++) {
        output[i] = input[i] * factor;
      }
    };

    // mic → analyser (visualização)
    // mic → processor (inversão) → gain → saída
    source.connect(analyser);
    source.connect(processor);
    processor.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    running = true;
    powerBtn.disabled = false;
    powerBtn.classList.add('on');
    setLabel('● LIGADO — ANC ATIVO', 'on');
    drawWave();

  } catch (e) {
    powerBtn.disabled = false;
    setLabel('ERRO: ' + (e.message || 'Microfone negado'), 'err');
  }
}

function stop() {
  powerBtn.classList.remove('on');
  powerBtn.classList.add('stopping');
  powerBtn.disabled = true;
  setLabel('DESLIGANDO…', '');

  cancelAnimationFrame(animId);

  try { processor && processor.disconnect(); } catch(_) {}
  try { gainNode  && gainNode.disconnect();  } catch(_) {}
  try { source    && source.disconnect();    } catch(_) {}
  try { analyser  && analyser.disconnect();  } catch(_) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();

  audioCtx = processor = gainNode = source = analyser = stream = null;
  running = false;

  setTimeout(() => {
    powerBtn.classList.remove('stopping');
    powerBtn.disabled = false;
    setLabel('DESLIGADO — clique para ligar', '');
    drawIdle();
  }, 400);
}

function setLabel(text, cls) {
  stateLabel.textContent = text;
  stateLabel.className = 'state-label ' + cls;
}

function drawWave() {
  animId = requestAnimationFrame(drawWave);
  if (!analyser) return;

  const W = canvas.width, H = canvas.height;
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(buf);

  ctx2d.fillStyle = '#0a1018';
  ctx2d.fillRect(0, 0, W, H);

  ctx2d.strokeStyle = 'rgba(0,229,255,0.07)';
  ctx2d.lineWidth = 1;
  ctx2d.beginPath();
  ctx2d.moveTo(0, H/2); ctx2d.lineTo(W, H/2);
  ctx2d.stroke();

  const grad = ctx2d.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0,   'rgba(0,229,255,0.15)');
  grad.addColorStop(0.5, 'rgba(0,229,255,1)');
  grad.addColorStop(1,   'rgba(0,229,255,0.15)');

  ctx2d.beginPath();
  ctx2d.strokeStyle = grad;
  ctx2d.lineWidth = 2;
  ctx2d.shadowBlur = 10;
  ctx2d.shadowColor = '#00e5ff';

  const step = W / buf.length;
  for (let i = 0; i < buf.length; i++) {
    const y = (buf[i] / 128) * (H / 2);
    i === 0 ? ctx2d.moveTo(0, y) : ctx2d.lineTo(i * step, y);
  }
  ctx2d.stroke();
  ctx2d.shadowBlur = 0;
}

function drawIdle() {
  const W = canvas.width, H = canvas.height;
  ctx2d.fillStyle = '#0a1018';
  ctx2d.fillRect(0, 0, W, H);
  ctx2d.strokeStyle = 'rgba(0,229,255,0.1)';
  ctx2d.lineWidth = 1;
  ctx2d.setLineDash([6, 10]);
  ctx2d.beginPath();
  ctx2d.moveTo(0, H/2); ctx2d.lineTo(W, H/2);
  ctx2d.stroke();
  ctx2d.setLineDash([]);
}

drawIdle();
</script>
</body>
</html>
