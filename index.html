<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden font-sans">

                </button>

        </div>
        
        <!-- Instruções Dinâmicas -->
        <div id="instruction-bar" class="bg-blue-900/30 text-blue-300 text-xs text-center py-1 hidden">
            Selecione uma ferramenta.
        </div>
    </footer>

    <script>
        // Inicializar Ícones
        lucide.createIcons();

        // Elementos DOM
        const video = document.getElementById('main-video');
        const canvas = document.getElementById('canvas-overlay');
        const ctx = canvas.getContext('2d');
        const videoContainer = document.getElementById('video-container');
        const emptyState = document.getElementById('empty-state');
        const uploadInput = document.getElementById('video-upload');
        const timeline = document.getElementById('timeline');
        const timeCurrent = document.getElementById('time-current');
        const timeDuration = document.getElementById('time-duration');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlay = document.getElementById('icon-play');
        const btnStepBack = document.getElementById('btn-step-back');
        const btnStepFwd = document.getElementById('btn-step-fwd');
        const toolBtns = document.querySelectorAll('.tool-btn');
        const btnClear = document.getElementById('btn-clear');
        const instructionBar = document.getElementById('instruction-bar');

        // Estado da Aplicação
        let appState = {
            isPlaying: false,
            duration: 0,
            fps: 30, // Estimado
            currentTool: 'select', // 'select', 'calibrate', 'player', 'ball'
            activeTrackId: null, // Para continuar rastreando o mesmo objeto
            tracks: [], // Array de objetos de rastreamento
            calibration: [] // Array de 4 pontos {x, y}
        };

        // Estrutura de um Track:
        // { id: string, type: 'player'|'ball', color: string, points: [{time: number, x: number, y: number}] }

        const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
        let colorIndex = 0;

        // --- Funções Utilitárias ---

        const formatTime = (seconds) => {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- Gerenciamento de Vídeo ---

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            video.src = url;
            
            // UI Updates
            emptyState.classList.add('hidden');
            video.classList.remove('hidden');
            canvas.classList.remove('hidden');
            
            // Enable controls
            timeline.disabled = false;
            btnPlayPause.disabled = false;
            btnStepBack.disabled = false;
            btnStepFwd.disabled = false;
            toolBtns.forEach(btn => btn.disabled = false);
            btnClear.disabled = false;

            // Reset state
            appState.tracks = [];
            appState.calibration = [];
            setTool('select');
        });

        video.addEventListener('loadedmetadata', () => {
            appState.duration = video.duration;
            timeline.max = video.duration;
            timeDuration.textContent = formatTime(video.duration);
            resizeCanvas();
            renderLoop(); // Iniciar loop de renderização
        });

        video.addEventListener('timeupdate', () => {
            if (!appState.isPlaying) { // Se estiver tocando, o renderLoop lida com a timeline para ser mais suave
                timeline.value = video.currentTime;
                timeCurrent.textContent = formatTime(video.currentTime);
            }
        });

        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            if (!video.videoWidth) return;
            // Fazer o canvas ter o mesmo tamanho do vídeo renderizado na tela
            const rect = video.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // Ajustar posição para sobrepor exatamente
            canvas.style.left = `${rect.left}px`;
            canvas.style.top = `${rect.top}px`;
        }

        // --- Controles de Playback ---

        const togglePlay = () => {
            if (video.paused) {
                video.play();
                appState.isPlaying = true;
                iconPlay.setAttribute('data-lucide', 'pause');
                setTool('select'); // Voltar para seleção ao dar play
            } else {
                video.pause();
                appState.isPlaying = false;
                iconPlay.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        };

        btnPlayPause.addEventListener('click', togglePlay);

        const stepFrame = (direction) => {
            if (appState.isPlaying) togglePlay();
            const step = 1 / appState.fps;
            video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (step * direction)));
            // Forçar atualização do input range e tempo
            timeline.value = video.currentTime;
            timeCurrent.textContent = formatTime(video.currentTime);
            render(); // Forçar render imediato
        };

        btnStepBack.addEventListener('click', () => stepFrame(-1));
        btnStepFwd.addEventListener('click', () => stepFrame(1));

        timeline.addEventListener('input', (e) => {
            if (appState.isPlaying) togglePlay();
            video.currentTime = parseFloat(e.target.value);
            timeCurrent.textContent = formatTime(video.currentTime);
            render();
        });

        // --- Ferramentas e Interação (Canvas) ---

        const setTool = (toolName) => {
            appState.currentTool = toolName;
            appState.activeTrackId = null; // Resetar active track ao mudar de ferramenta
            
            toolBtns.forEach(btn => {
                if (btn.dataset.tool === toolName) {
                    btn.classList.add('bg-gray-800', 'text-white');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('bg-gray-800', 'text-white');
                    btn.classList.add('text-gray-400');
                }
            });

            instructionBar.classList.remove('hidden');
            switch(toolName) {
                case 'calibrate':
                    instructionBar.textContent = `Toque para definir 4 pontos da perspectiva (Atual: ${appState.calibration.length}/4)`;
                    break;
                case 'player':
                    instructionBar.textContent = "Toque no jogador para rastrear (Avance frames para adicionar caminhos).";
                    break;
                case 'ball':
                    instructionBar.textContent = "Toque na bola para marcar sua posição.";
                    break;
                default:
                    instructionBar.classList.add('hidden');
            }
        };

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => setTool(btn.dataset.tool));
        });

        btnClear.addEventListener('click', () => {
            if(confirm("Deseja apagar todos os rastreios e calibrações?")) {
                appState.tracks = [];
                appState.calibration = [];
                appState.activeTrackId = null;
                setTool('select');
                render();
            }
        });

        // Converter coordenadas do clique para coordenadas do canvas interno
        const getCanvasCoords = (e) => {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        const handlePointerDown = (e) => {
            if (!video.src || appState.isPlaying) return;
            
            const coords = getCanvasCoords(e);
            const time = video.currentTime;

            if (appState.currentTool === 'calibrate') {
                if (appState.calibration.length < 4) {
                    appState.calibration.push(coords);
                    setTool('calibrate'); // Update instruction text
                } else {
                    // Reset e recomeça
                    appState.calibration = [coords];
                    setTool('calibrate');
                }
            } 
            else if (appState.currentTool === 'player' || appState.currentTool === 'ball') {
                
                let track;
                // Se já temos um track ativo dessa ferramenta, adicionamos ponto a ele
                if (appState.activeTrackId) {
                    track = appState.tracks.find(t => t.id === appState.activeTrackId);
                } 
                
                // Se não tem ou mudou de ferramenta, cria novo
                if (!track) {
                    track = {
                        id: generateId(),
                        type: appState.currentTool,
                        color: COLORS[colorIndex % COLORS.length],
                        points: []
                    };
                    colorIndex++;
                    appState.tracks.push(track);
                    appState.activeTrackId = track.id;
                }

                // Verifica se já existe um ponto muito próximo deste tempo, se sim, substitui
                const existingPointIndex = track.points.findIndex(p => Math.abs(p.time - time) < 0.05);
                if (existingPointIndex > -1) {
                    track.points[existingPointIndex] = { time, x: coords.x, y: coords.y };
                } else {
                    track.points.push({ time, x: coords.x, y: coords.y });
                    // Ordena por tempo para interpolação funcionar corretamente
                    track.points.sort((a, b) => a.time - b.time);
                }
            }
            
            render();
        };

        // Eventos unificados para Mouse e Touch
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Previne scroll ao tocar no canvas
            handlePointerDown(e);
        }, { passive: false });

        // --- Lógica de Renderização ---

        // Interpolação linear entre dois pontos
        const lerp = (start, end, amt) => {
            return (1 - amt) * start + amt * end;
        };

        // Obter posição interpolada de um track num dado tempo
        const getTrackPositionAtTime = (track, time) => {
            if (track.points.length === 0) return null;
            if (track.points.length === 1) {
                // Mostrar apenas se estiver muito perto do tempo do frame (ex: +- 0.2s)
                return Math.abs(track.points[0].time - time) < 0.2 ? track.points[0] : null;
            }

            // Encontrar pontos antes e depois do tempo atual
            let pBefore = null;
            let pAfter = null;

            for (let i = 0; i < track.points.length; i++) {
                if (track.points[i].time <= time) pBefore = track.points[i];
                if (track.points[i].time > time && !pAfter) pAfter = track.points[i];
            }

            if (!pBefore && pAfter) return null; // Antes do primeiro ponto marcado
            if (pBefore && !pAfter) {
                 // Depois do último ponto. Mostrar se estiver perto.
                 return Math.abs(pBefore.time - time) < 0.5 ? pBefore : null;
            }
            
            // Interpolação
            const tDiff = pAfter.time - pBefore.time;
            const tProg = (time - pBefore.time) / tDiff;
            
            return {
                x: lerp(pBefore.x, pAfter.x, tProg),
                y: lerp(pBefore.y, pAfter.y, tProg)
            };
        };

        // Desenhar Quadrilátero de Calibração com "Perspectiva" visual
        const drawCalibrationGrid = () => {
            const pts = appState.calibration;
            if (pts.length === 0) return;

            ctx.lineWidth = 2;
            
            // Desenhar linhas conectando
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            if (pts.length === 4) {
                ctx.closePath();
                ctx.fillStyle = 'rgba(59, 130, 246, 0.15)'; // Blue tint
                ctx.fill();
                
                // Desenhar grade interna simplificada (interpolação bilinear)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                const steps = 5;
                
                // Linhas verticais da grade
                for(let i=1; i<steps; i++) {
                    const u = i/steps;
                    const topX = lerp(pts[0].x, pts[1].x, u);
                    const topY = lerp(pts[0].y, pts[1].y, u);
                    const botX = lerp(pts[3].x, pts[2].x, u);
                    const botY = lerp(pts[3].y, pts[2].y, u);
                    ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(botX, botY); ctx.stroke();
                }
                // Linhas horizontais da grade
                for(let i=1; i<steps; i++) {
                    const v = i/steps;
                    const leftX = lerp(pts[0].x, pts[3].x, v);
                    const leftY = lerp(pts[0].y, pts[3].y, v);
                    const rightX = lerp(pts[1].x, pts[2].x, v);
                    const rightY = lerp(pts[1].y, pts[2].y, v);
                    ctx.beginPath(); ctx.moveTo(leftX, leftY); ctx.lineTo(rightX, rightY); ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
            }
            ctx.stroke();

            // Desenhar os nós
            pts.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            });
        };

        const drawMarker = (x, y, color, type, isActive) => {
            if (type === 'player') {
                // Desenhar disco de perspectiva no chão (elipse)
                ctx.beginPath();
                // A elipse simula a perspectiva. Fixo para MVP, mas poderia depender da calibração.
                ctx.ellipse(x, y + 10, 15, 6, 0, 0, Math.PI * 2); 
                ctx.fillStyle = color + '80'; // Transparente
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Ponto central
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                
                // Linha vertical (cone)
                ctx.beginPath();
                ctx.moveTo(x, y+10);
                ctx.lineTo(x, y-20);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Info tag se ativo
                if (isActive) {
                    ctx.fillStyle = color;
                    ctx.fillRect(x + 10, y - 30, 10, 10);
                }

            } else if (type === 'ball') {
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            }
        };

        const drawTracks = () => {
            const time = video.currentTime;
            
            appState.tracks.forEach(track => {
                const pos = getTrackPositionAtTime(track, time);
                
                // Desenhar o rastro (caminho) para trás
                if (track.points.length > 1) {
                    ctx.beginPath();
                    let hasStarted = false;
                    for (let i = 0; i < track.points.length; i++) {
                        const pt = track.points[i];
                        if (pt.time <= time) {
                            if (!hasStarted) {
                                ctx.moveTo(pt.x, pt.y);
                                hasStarted = true;
                            } else {
                                ctx.lineTo(pt.x, pt.y);
                            }
                        }
                    }
                    if (pos && hasStarted) {
                        ctx.lineTo(pos.x, pos.y);
                    }
                    ctx.strokeStyle = track.color + '60'; // Semitransparente
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]); // Reset
                }

                // Desenhar o marcador atual
                if (pos) {
                    const isActive = track.id === appState.activeTrackId;
                    drawMarker(pos.x, pos.y, track.color, track.type, isActive);
                }
            });
        };

        const render = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCalibrationGrid();
            drawTracks();
        };

        const renderLoop = () => {
            if (appState.isPlaying) {
                timeline.value = video.currentTime;
                timeCurrent.textContent = formatTime(video.currentTime);
                render();
            }
            requestAnimationFrame(renderLoop);
        };

    </script>
</body>
</html>
